# conda env create -f watermark_research/environment.yml
# then:  pip install --no-deps silentcipher==1.0.5
# (or simply run  bash setup_env.sh  from the repository root, which does both)
name: latentmark
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - av=11.0.0
  - numpy=1.26.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.0
      - torchaudio==2.1.0
      - torchvision==0.16.0
      - xformers==0.0.22.post7
      - -r requirements.txt
